# Isolated, local-password E2E runtime. Never combine with production/local overrides.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - e2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GOOGLE_DRIVE_ENABLED: "false"
    image: dynachat-app:e2e
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_DIST: /app/frontend/dist
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ADMIN_USER_EMAIL: ${E2E_USER}
      AUTH_MODE: local
      APP_ORIGINS: http://localhost:8001
      GOOGLE_DRIVE_ENABLED: "false"
      GOOGLE_DRIVE_AUTO_ONBOARD: "false"
      CLINICAL_EXTERNAL_LLM_ENABLED: "false"
      SEED_ENABLE: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  e2e_postgres:
