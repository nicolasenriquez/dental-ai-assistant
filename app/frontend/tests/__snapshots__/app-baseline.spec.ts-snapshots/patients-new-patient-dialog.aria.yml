- complementary:
  - link "Dental AI Assistant":
    - /url: /patients
  - button "Colapsar navegación" [expanded]
  - navigation "Navegación principal":
    - link "Pacientes":
      - /url: /patients
    - link "Asistente":
      - /url: /assistant
    - link "Chat":
      - /url: /chat
  - button "Abrir menú de usuario para admin@email.com"
- main:
  - heading "Pacientes" [level=1]
  - paragraph: Gestiona pacientes y sus evoluciones dentales.
  - button "+ Nuevo paciente"
  - text: Buscar por nombre, teléfono o RUT
  - textbox "Buscar por nombre, teléfono o RUT":
    - /placeholder: Buscar paciente…
  - text: Evoluciones
  - combobox "Evoluciones":
    - option "Todas" [selected]
    - option "Con evoluciones"
    - option "Sin evoluciones"
  - text: Ordenar por
  - combobox "Ordenar por":
    - option "Apellidos" [selected]
    - option "Nombres"
    - option "Última evolución"
  - button "Orden descendente"
  - paragraph: Nombre, teléfono o RUT. Para un RUT completo, incluye guion y DV.
  - status: 1 paciente
  - table "Pacientes encontrados":
    - caption: Pacientes encontrados
    - rowgroup:
      - row "Paciente Edad Última evolución Abrir ficha":
        - columnheader "Paciente"
        - columnheader "Edad"
        - columnheader "Última evolución"
        - columnheader "Abrir ficha"
    - rowgroup:
      - row /Juan Perez \d+ años \d+ sep \d+ · \d+:\d+/:
        - cell "Juan Perez":
          - link "Juan Perez":
            - /url: /patients/fc583c6a-8f9e-4579-9169-cc9335644c12
            - strong: Juan Perez
        - cell /\d+ años/
        - cell /\d+ sep \d+ · \d+:\d+/:
          - time: /\d+ sep \d+ · \d+:\d+/
        - cell
  - dialog "Nuevo paciente":
    - button "Cerrar"
    - heading "Nuevo paciente" [level=2]
    - paragraph: Crea la ficha básica. Podrás agregar una evolución después.
    - paragraph: Nombres, apellidos y RUT son obligatorios.
    - text: Nombres
    - textbox "Nombres"
    - text: Apellidos
    - textbox "Apellidos"
    - text: RUT
    - textbox "RUT"
    - text: Fecha de nacimientoOpcional
    - textbox "Fecha de nacimientoOpcional":
      - /placeholder: dd/mm/aaaa
    - button "Abrir calendario para fecha de nacimiento"
    - text: Teléfono Opcional
    - textbox "Teléfono Opcional"
    - text: Correo Opcional
    - textbox "Correo Opcional"
    - button "Cancelar"
    - button "Crear paciente"